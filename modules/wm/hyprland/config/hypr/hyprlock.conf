# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
  ignore_empty_input = true
}

# BACKGROUND
background {
  path = screenshot
  blur_size = 1
  blur_passes = 3
}

# INPUT FIELD
input-field {
  monitor =
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.5
  dots_center = true
  dots_rounding = -1
  outer_color = rgb(151515)
  inner_color = rgb(200, 200, 200)
  font_color = rgb(10, 10, 10)
  fade_on_empty = true
  fade_timeout = 1000
  placeholder_text = 
  hide_input = false
  rounding = -1
  check_color = rgb(204, 136, 34)
  fail_color = rgb(204, 34, 34)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  fail_timeout = 2000
  fail_transition = 300
  capslock_color = -1
  numlock_color = -1
  bothlock_color = -1
  invert_numlock = true
  swap_font_color = true

  size = 800, 50
  position = 0, 200
  valign = bottom
}
